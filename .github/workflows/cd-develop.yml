name: CD develop
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      schemas:
        default: "lex_core vigilis"
permissions:
  contents: read
  packages: write
concurrency:
  group: cd-lexvertex-migrate-develop
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andresalbertor/lexvertex
  VPS_VM_ID: ${{ vars.VPS_VM_ID != '' && vars.VPS_VM_ID || '2094330' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: chmod +x ./gradlew && ./gradlew check --no-daemon --no-configuration-cache
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: chmod +x ./gradlew && ./gradlew installDist --no-daemon --no-configuration-cache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/db-migrations:latest
            ${{ env.IMAGE_PREFIX }}/db-migrations:${{ github.sha }}
  migrate:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch or run migrate
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_MIGRATE_ENV: ${{ secrets.VPS_MIGRATE_ENV }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SCHEMAS: ${{ github.event.inputs.schemas || 'lex_core vigilis' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOSTINGER_API_TOKEN:-}" && -n "${VPS_MIGRATE_ENV:-}" ]]; then
            echo "Local migrate secrets present but script lives in infra — dispatching monorepo"
          fi
          curl -fsS -X POST -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/andresalbertor/lexvertex/dispatches \
            -d "{\"event_type\":\"split-migrate\",\"client_payload\":{\"schemas\":\"${SCHEMAS}\"}}"
          echo
